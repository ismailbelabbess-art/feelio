<title>Mewonen — Draw your mood</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',-apple-system,sans-serif;background:#0a0a18;color:#fff;min-height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}

/* CALMCHAOS BACKGROUND */
#calmchaos{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.cc-wave{position:absolute;border-radius:50%;opacity:0.04;animation:ccw 12s ease-in-out infinite}
.cc-wave:nth-child(1){width:600px;height:600px;background:radial-gradient(circle,#a78bfa,transparent);top:-200px;left:-100px;animation-delay:0s}
.cc-wave:nth-child(2){width:500px;height:500px;background:radial-gradient(circle,#7c3aed,transparent);bottom:-150px;right:-100px;animation-delay:-4s}
.cc-wave:nth-child(3){width:400px;height:400px;background:radial-gradient(circle,#fbbf24,transparent);top:50%;left:50%;transform:translate(-50%,-50%);animation-delay:-8s}
@keyframes ccw{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(30px,-20px) scale(1.1)}50%{transform:translate(-10px,30px) scale(0.95)}75%{transform:translate(-20px,-10px) scale(1.05)}}
.cc-particles{position:absolute;inset:0}
.cc-p{position:absolute;width:2px;height:2px;border-radius:50%;background:#a78bfa;opacity:0;animation:ccp 8s linear infinite}
@keyframes ccp{0%{transform:translateY(100vh) scale(0);opacity:0}20%{opacity:0.6}100%{transform:translateY(-10vh) scale(3);opacity:0}}
.cc-blob{position:absolute;width:300px;height:300px;border-radius:60% 40% 30% 70%/60% 30% 70% 40%;background:linear-gradient(135deg,rgba(167,139,250,0.03),rgba(251,191,36,0.02));filter:blur(60px);animation:ccb 10s ease-in-out infinite}
.cc-blob:nth-child(6){top:20%;left:10%;animation-delay:0s}
.cc-blob:nth-child(7){bottom:20%;right:10%;animation-delay:-5s}
@keyframes ccb{0%,100%{border-radius:60% 40% 30% 70%/60% 30% 70% 40%;transform:translate(0,0) rotate(0deg)}50%{border-radius:30% 60% 70% 40%/50% 60% 30% 60%;transform:translate(20px,-20px) rotate(180deg)}}

/* APP */
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100dvh;opacity:0;transition:opacity 0.8s ease}
#app.ready{opacity:1}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0));flex-shrink:0;z-index:10}
.menu-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;font-size:1.2rem;cursor:pointer;color:rgba(255,255,255,0.5);transition:all 0.2s;backdrop-filter:blur(10px)}
.menu-btn:active{transform:scale(0.9);background:rgba(139,92,246,0.1)}
.isme-top{display:flex;align-items:center;gap:8px;cursor:pointer}
.isme-top .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#a78bfa);display:flex;align-items:center;justify-content:center;font-size:0.9rem;box-shadow:0 0 20px rgba(124,58,237,0.2)}
.isme-top .av-text{font-size:0.55rem;color:rgba(255,255,255,0.4);max-width:120px;line-height:1.3;text-align:right}

.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 20px 80px;position:relative;z-index:2}

.defi-tag{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;background:rgba(139,92,246,0.08);border:1px solid rgba(139,92,246,0.1);font-size:0.55rem;color:#a78bfa;margin-bottom:16px;animation:fp 2s ease-in-out infinite}
@keyframes fp{0%,100%{box-shadow:0 0 0 rgba(139,92,246,0)}50%{box-shadow:0 0 20px rgba(139,92,246,0.1)}}

.cwrap{position:relative;margin-bottom:12px}
.cwrap::before{content:'';position:absolute;inset:-8px;border-radius:50%;background:conic-gradient(from 0deg,#7c3aed,#a78bfa,#fbbf24,#a78bfa,#7c3aed);opacity:0.15;animation:cr 4s linear infinite;filter:blur(8px)}
@keyframes cr{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
canvas#c{width:260px;height:260px;border-radius:50%;background:rgba(10,10,24,0.4);backdrop-filter:blur(4px);border:1.5px solid rgba(139,92,246,0.1);touch-action:none;cursor:crosshair;display:block;position:relative;z-index:1;box-shadow:0 0 60px rgba(124,58,237,0.1),inset 0 0 60px rgba(0,0,0,0.3);transition:all 0.5s ease}
canvas#c.m-joy{box-shadow:0 0 60px rgba(251,191,36,0.2),inset 0 0 60px rgba(251,191,36,0.05)}
canvas#c.m-sad{box-shadow:0 0 60px rgba(59,130,246,0.2),inset 0 0 60px rgba(59,130,246,0.05)}
canvas#c.m-angry{box-shadow:0 0 60px rgba(239,68,68,0.2),inset 0 0 60px rgba(239,68,68,0.05)}
canvas#c.m-calm{box-shadow:0 0 60px rgba(139,92,246,0.2),inset 0 0 60px rgba(139,92,246,0.05)}
canvas#c.m-empty{box-shadow:0 0 60px rgba(107,114,128,0.15),inset 0 0 60px rgba(107,114,128,0.03)}

#re{font-size:2.4rem;min-height:50px;animation:pi 0.5s cubic-bezier(0.34,1.56,0.64,1)}
#rp{color:rgba(255,255,255,0.7);font-size:0.65rem;text-align:center;max-width:280px;min-height:20px}
@keyframes pi{0%{opacity:0;transform:scale(0.3)}100%{opacity:1;transform:scale(1)}}

.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:10px 20px;border-radius:50px;font-size:0.65rem;font-weight:500;cursor:pointer;border:none;transition:all 0.2s;font-family:inherit;letter-spacing:0.3px}
.btn:active{transform:scale(0.94)}
.btn-p{background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;box-shadow:0 4px 20px rgba(124,58,237,0.2)}
.btn-o{background:transparent;color:#a78bfa;border:1px solid rgba(139,92,246,0.15)}
.btn-s{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#0a0a18;font-weight:600}

.infos{display:flex;gap:16px;align-items:center;margin-top:10px;font-size:0.55rem;color:rgba(255,255,255,0.3)}
.infos .streak{display:flex;align-items:center;gap:4px;color:#fbbf24}
.infos .streak .sf{font-size:0.8rem}
.infos .fw{cursor:pointer;display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:12px;background:rgba(251,191,36,0.06);border:1px solid rgba(251,191,36,0.1);animation:fwspin 3s linear infinite}
@keyframes fwspin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

.counter{color:rgba(255,255,255,0.1);font-size:0.45rem;margin-top:6px}
.counter span{color:#a78bfa}

/* TOAST */
#toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:400;background:rgba(22,22,44,0.95);padding:8px 16px;border-radius:12px;color:#fff;font-size:0.55rem;opacity:0;pointer-events:none;transition:all 0.3s;border:1px solid rgba(139,92,246,0.1);backdrop-filter:blur(12px);white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-10px)}

/* CONFETTI */
.confetti{position:fixed;pointer-events:none;z-index:300;animation:cf 2.5s ease-out forwards;font-size:1.2rem}
@keyframes cf{0%{transform:translateY(0) rotate(0deg) scale(1);opacity:1}100%{transform:translateY(100vh) rotate(720deg) scale(0);opacity:0}}

/* ISME BUBBLE */
#ismeBubble{position:fixed;bottom:120px;left:16px;z-index:200;background:rgba(22,22,44,0.95);border:1px solid rgba(139,92,246,0.1);border-radius:16px;padding:12px 16px;max-width:200px;font-size:0.6rem;color:rgba(255,255,255,0.85);backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(0,0,0,0.5);display:none;line-height:1.5;animation:bb 0.4s ease-out}
#ismeBubble.show{display:block}
@keyframes bb{0%{opacity:0;transform:translateY(10px) scale(0.9)}100%{opacity:1;transform:translateY(0) scale(1)}}
#ismeClose{position:absolute;top:4px;right:8px;background:none;border:none;color:rgba(255,255,255,0.2);cursor:pointer;font-size:0.7rem}

/* MENU OVERLAY */
#menuOverlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.6);display:none;backdrop-filter:blur(4px)}
#menuOverlay.show{display:block}
#menuPanel{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:501;background:rgba(14,14,30,0.98);backdrop-filter:blur(20px);border-right:1px solid rgba(255,255,255,0.03);transform:translateX(-100%);transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);padding:20px;display:flex;flex-direction:column;gap:4px}
#menuPanel.show{transform:translateX(0)}
.menu-logo{font-size:1.4rem;font-weight:100;letter-spacing:10px;color:#fff;margin-bottom:16px;text-align:center}
.menu-logo span{color:#a78bfa;font-weight:200}
.menu-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;cursor:pointer;color:rgba(255,255,255,0.4);transition:all 0.2s;font-size:0.65rem;border:none;background:none;font-family:inherit;width:100%;text-align:left}
.menu-item:hover,.menu-item.active{background:rgba(139,92,246,0.06);color:#a78bfa}
.menu-item .mi{font-size:1.1rem}

/* SCREENS */
.scr{display:none;flex-direction:column;align-items:center;padding:20px 20px 80px;width:100%;height:100%;overflow-y:auto;position:relative;z-index:1}
.scr.active{display:flex}
.st{font-size:1rem;font-weight:200;letter-spacing:3px;margin-bottom:2px;color:#fff}
.ss{color:rgba(255,255,255,0.2);font-size:0.45rem;margin-bottom:12px}

.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;max-width:300px}
.gi{aspect-ratio:1;border-radius:12px;background:rgba(255,255,255,0.02);overflow:hidden;border:1px solid rgba(255,255,255,0.03)}
.gi img{width:100%;height:100%;object-fit:cover}

.scard{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,0.02);border-radius:12px;width:100%;max-width:280px;margin:3px 0}
.scard .e{font-size:1.2rem}
.scard .inf{display:flex;flex-direction:column;flex:1}
.scard .inf .n{font-size:0.7rem;font-weight:500;color:#fff}
.scard .inf .l{font-size:0.4rem;color:rgba(255,255,255,0.15)}
.scard .bar{height:2px;border-radius:2px;background:rgba(139,92,246,0.08);margin-top:2px;width:100%}
.scard .bar span{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#7c3aed,#a78bfa);transition:width 0.8s ease}

.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;max-width:300px;margin:6px 0}
.mc{display:flex;flex-direction:column;align-items:center;padding:8px 4px;background:rgba(255,255,255,0.02);border-radius:10px;font-size:0.35rem;border:1px solid rgba(255,255,255,0.02)}
.mc .f{font-size:1rem}
.mc .n{color:rgba(255,255,255,0.2);margin-top:2px}
.mc .m{font-size:0.8rem;margin-top:2px}

.lc{max-width:380px;width:100%;padding:4px 0;font-size:0.45rem;line-height:1.8;color:rgba(255,255,255,0.4);text-align:left}
.lc h3{color:#a78bfa;font-size:0.5rem;font-weight:500;margin:8px 0 2px}
.lc a{color:#a78bfa;text-decoration:none}
.lc .ld{height:0.5px;background:rgba(255,255,255,0.03);margin:8px 0}

@media(min-width:600px){canvas#c{width:300px;height:300px}.gg{grid-template-columns:repeat(4,1fr);max-width:380px}.mg{grid-template-columns:repeat(4,1fr);max-width:380px}}
@media(max-width:380px){canvas#c{width:220px;height:220px}}
</style>
</head>
<body>

<div id="calmchaos">
  <div class="cc-wave"></div>
  <div class="cc-wave"></div>
  <div class="cc-wave"></div>
  <div class="cc-particles" id="ccParticles"></div>
  <div class="cc-blob"></div>
  <div class="cc-blob"></div>
</div>

<div id="app">
  <div class="top-bar">
    <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
    <div class="isme-top" id="ismeTop">
      <span class="av-text" id="ismeTopText">Bonjour. Je suis ISME. 💜</span>
      <div class="av">✦</div>
    </div>
  </div>

  <div class="main">
    <div class="defi-tag" id="defiTag">🌟 <span id="defiText">Dessine ta confiance</span></div>
    <div class="cwrap"><canvas id="c" width="500" height="500" aria-label="Draw your mood"></canvas></div>
    <div id="re"></div><div id="rp"></div>
    <div class="actions">
      <button class="btn btn-o" id="btnClear">Clear</button>
      <button class="btn btn-p" id="btnShare">📤 Share</button>
      <button class="btn btn-s" id="btnStatut">📱 Statut</button>
    </div>
    <div class="infos">
      <div class="streak"><span class="sf">🔥</span><span id="streakCount">0</span> jours</div>
      <div class="fw" id="fwBtn" title="Feel Wheel">🎡</div>
    </div>
    <div class="counter"><span id="tc">0</span> <span id="cl">moods drawn</span></div>
  </div>
</div>

<div id="toast"></div>
<div id="ismeBubble"><button id="ismeClose">✕</button><span id="ismeText"></span></div>

<div id="menuOverlay" id="menuOverlay"></div>
<div id="menuPanel">
  <div class="menu-logo">MEWO<span>NEN</span></div>
  <button class="menu-item active" data-sc="draw"><span class="mi">✍️</span> Draw</button>
  <button class="menu-item" data-sc="gallery"><span class="mi">🖼️</span> Gallery</button>
  <button class="menu-item" data-sc="stats"><span class="mi">📊</span> Stats</button>
  <button class="menu-item" data-sc="map"><span class="mi">🌍</span> World Mood</button>
  <button class="menu-item" data-sc="legal"><span class="mi">⚖️</span> Privacy & Legal</button>
</div>

<script>
var $=function(id){return document.getElementById(id);};
var canvas=$('c'),ctx=canvas.getContext('2d');
var brush=4,pts=[],isDrawing=false,history=[],gallery=[],streak=0,ismeTimer=null;

function init(){
  loadData();
  setupCanvas();
  setupMenu();
  setupButtons();
  setupCalmchaos();
  updateCounter();
  updateStreak();
  updateDefi();
  setTimeout(function(){showIsme('Hello. I\'m ISME. Draw your mood, I\'ll listen. 💜',4000);},1500);
  startIsmeTimer();
  updateGlobeCounter();
  $('app').classList.add('ready');
}

function loadData(){
  try{
    history=JSON.parse(localStorage.getItem('mw_h')||'[]');
    gallery=JSON.parse(localStorage.getItem('mw_g')||'[]');
    streak=parseInt(localStorage.getItem('mw_s')||'0');
  }catch(e){history=[];gallery=[];streak=0;}
}
function saveData(){
  try{
    localStorage.setItem('mw_h',JSON.stringify(history));
    localStorage.setItem('mw_g',JSON.stringify(gallery));
    localStorage.setItem('mw_s',streak.toString());
  }catch(e){}
}

function setupCalmchaos(){
  var c=$('ccParticles');
  for(var i=0;i<30;i++){
    var p=document.createElement('div');
    p.className='cc-p';
    p.style.left=Math.random()*100+'%';
    p.style.animationDelay=Math.random()*8+'s';
    p.style.animationDuration=(6+Math.random()*8)+'s';
    c.appendChild(p);
  }
}

function updateDefi(){
  var defis=['Dessine la forme de ta confiance','Dessine ton safe place','Dessine un souvenir heureux','Dessine l\'ombre de ta peur','Dessine la couleur de l\'espoir','Dessine le bruit de la paix','Dessine la texture de ta joie','Dessine le poids de ta tristesse','Dessine la légèreté de la liberté','Dessine la forme de l\'amour'];
  var d=new Date().getDate();
  $('defiText').textContent=defis[d%defis.length];
}

function setupCanvas(){
  function getPos(e){
    var r=canvas.getBoundingClientRect();
    var cx=e.touches?e.touches[0].clientX:e.clientX;
    var cy=e.touches?e.touches[0].clientY:e.clientY;
    return{x:(cx-r.left)*(canvas.width/r.width),y:(cy-r.top)*(canvas.height/r.height)};
  }
  function start(e){e.preventDefault();isDrawing=true;pts=[];var p=getPos(e);pts.push(p);ctx.beginPath();ctx.moveTo(p.x,p.y);}
  function move(e){e.preventDefault();if(!isDrawing)return;var p=getPos(e);pts.push(p);ctx.lineTo(p.x,p.y);ctx.strokeStyle='rgba(200,180,255,0.85)';ctx.lineWidth=brush;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();}
  function end(){if(!isDrawing)return;isDrawing=false;if(pts.length<4)return;analyze(pts);}
  canvas.addEventListener('touchstart',start,{passive:false});
  canvas.addEventListener('touchmove',move,{passive:false});
  canvas.addEventListener('touchend',end);
  canvas.addEventListener('mousedown',start);
  canvas.addEventListener('mousemove',move);
  canvas.addEventListener('mouseup',end);
  canvas.addEventListener('mouseleave',end);
}

function analyze(pts){
  var dist=0;
  for(var i=1;i<pts.length;i++){var dx=pts[i].x-pts[i-1].x,dy=pts[i].y-pts[i-1].y;dist+=Math.sqrt(dx*dx+dy*dy);}
  var idx=0;
  if(dist>400)idx=0;else if(dist>250)idx=4;else if(dist>120)idx=1;else if(dist<20)idx=12;else idx=2;
  var emos=[{e:'☀️',p:'You are shining today.',m:'joy'},{e:'🌧️',p:'Let it wash over you.',m:'sad'},{e:'🌪️',p:'Even storms run out of rain.',m:'angry'},{e:'🌈',p:'Look what you crossed.',m:'calm'},{e:'⚡',p:'This energy is yours.',m:'angry'},{e:'🌙',p:'Rest is not weakness.',m:'calm'},{e:'🔥',p:'Passion is power.',m:'angry'},{e:'🌱',p:'Hope whispers.',m:'calm'},{e:'🙏',p:'Gratitude changes you.',m:'joy'},{e:'💨',p:'Let the wind carry you.',m:'calm'},{e:'🌫️',p:'Clarity comes slowly.',m:'sad'},{e:'❄️',p:'Spring always comes.',m:'sad'},{e:'🕳️',p:'Space waiting for you.',m:'empty'}];
  var emo=emos[idx];
  $('re').textContent=emo.e;$('rp').textContent=emo.p;
  canvas.className='m-'+emo.m;
  var today=new Date().toISOString().split('T')[0];
  history.push({date:today,emoji:emo.e,mood:emo.m});
  if(history.length>30)history.shift();
  gallery.unshift({data:canvas.toDataURL('image/png'),date:today,mood:emo.m});
  if(gallery.length>12)gallery.pop();
  saveData();
  updateCounter();updateStreak();
  if(emo.m==='joy')spawnHearts();
  var msg='';
  if(emo.m==='sad')msg='I\'m here. You\'re not alone. 💜';
  else if(emo.m==='joy')msg='You\'re radiant! ✨';
  else if(emo.m==='angry')msg='That energy is powerful. Channel it. 🔥';
  else if(emo.m==='calm')msg='Peace is within you. 🌙';
  else if(emo.m==='empty')msg='Space is waiting. Fill it gently. 🕳️';
  showIsme(msg,4000);
  setTimeout(function(){canvas.className='';},3000);
}

function spawnHearts(){
  var hearts=['💜','💛','✨','🌟','💖','💝','💕','💗'];
  for(var i=0;i<20;i++){
    var el=document.createElement('div');
    el.className='confetti';
    el.textContent=hearts[Math.floor(Math.random()*hearts.length)];
    el.style.left=Math.random()*100+'%';
    el.style.top='-30px';
    el.style.animationDuration=(2+Math.random()*2)+'s';
    el.style.animationDelay=Math.random()*0.5+'s';
    document.body.appendChild(el);
    setTimeout(function(){el.remove();},3000);
  }
}

function updateCounter(){$('tc').textContent=history.length;}
function updateStreak(){
  if(history.length===0){streak=0;$('streakCount').textContent='0';return;}
  var today=new Date().toISOString().split('T')[0];
  var last=history[history.length-1].date;
  if(last===today){
    var c=0,d=new Date(today);
    for(var i=history.length-1;i>=0;i--){var hd=new Date(history[i].date);var diff=Math.floor((d-hd)/86400000);if(diff===c)c++;else break;}
    streak=c;
  }else{
    var y=new Date();y.setDate(y.getDate()-1);var ys=y.toISOString().split('T')[0];
    if(last===ys){
      var c2=0,d2=new Date(today);
      for(var j=history.length-1;j>=0;j--){var hd2=new Date(history[j].date);var diff2=Math.floor((d2-hd2)/86400000);if(diff2===c2)c2++;else break;}
      streak=c2;
    }else{streak=0;}
  }
  saveData();
  $('streakCount').textContent=streak;
}

function downloadStatut(){
  var emoji=$('re').textContent||'💜';
  var phrase=$('rp').textContent||'Draw your mood on Mewonen';
  var c2=document.createElement('canvas');c2.width=800;c2.height=800;
  var ctx2=c2.getContext('2d');
  var grad=ctx2.createLinearGradient(0,0,800,800);grad.addColorStop(0,'#1a1030');grad.addColorStop(1,'#0a0a18');
  ctx2.fillStyle=grad;ctx2.fillRect(0,0,800,800);
  ctx2.strokeStyle='#7c3aed';ctx2.lineWidth=4;ctx2.strokeRect(20,20,760,760);
  ctx2.textAlign='center';ctx2.textBaseline='middle';
  ctx2.font='200px Arial';ctx2.fillStyle='#fff';ctx2.fillText(emoji,400,320);
  ctx2.font='36px Inter,sans-serif';ctx2.fillStyle='rgba(255,255,255,0.7)';ctx2.fillText(phrase,400,480);
  ctx2.font='24px Inter,sans-serif';ctx2.fillStyle='#a78bfa';ctx2.fillText('💜 Mewonen.com',400,580);
  var l=document.createElement('a');l.download='mewonen-statut.png';l.href=c2.toDataURL('image/png');l.click();
  showToast('📱 Statut downloaded!');
}
function dataURLToBlob(d){var a=d.split(','),m=a[0].match(/:(.*?);/)[1],b=atob(a[1]),n=b.length,u=new Uint8Array(n);while(n--)u[n]=b.charCodeAt(n);return new Blob([u],{type:m});}

function setupMenu(){
  $('menuBtn').addEventListener('click',function(){$('menuPanel').classList.add('show');$('menuOverlay').classList.add('show');});
  $('menuOverlay').addEventListener('click',function(){$('menuPanel').classList.remove('show');$('menuOverlay').classList.remove('show');});
  document.querySelectorAll('.menu-item').forEach(function(item){
    item.addEventListener('click',function(){
      var sc=this.dataset.sc;
      $('menuPanel').classList.remove('show');$('menuOverlay').classList.remove('show');
      document.querySelectorAll('.menu-item').forEach(function(m){m.classList.remove('active');});
      this.classList.add('active');
      if(sc==='draw'){$('app').querySelector('.main').style.display='flex';}
      else{showScreen(sc);}
    });
  });
}

function buildGallery(){
  var grid=document.getElementById('gg');if(!grid)return;
  grid.innerHTML='';
  if(gallery.length===0){grid.innerHTML='<div style="color:rgba(255,255,255,0.1);grid-column:1/-1;padding:16px;font-size:0.5rem;text-align:center">No drawings yet.<br>Draw your first mood!</div>';return;}
  gallery.forEach(function(item){var d=document.createElement('div');d.className='gi';var img=document.createElement('img');img.src=item.data;img.alt='Drawing';img.loading='lazy';d.appendChild(img);grid.appendChild(d);});
}

function buildStats(){
  var c=document.getElementById('scContainer');if(!c)return;
  c.innerHTML='';
  if(history.length===0){c.innerHTML='<div style="color:rgba(255,255,255,0.1);padding:16px;font-size:0.5rem">No data yet.</div>';return;}
  var counts={};history.forEach(function(h){counts[h.emoji]=(counts[h.emoji]||0)+1;});
  var sorted=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];});
  var max=sorted.length?counts[sorted[0]]:1;
  sorted.slice(0,6).forEach(function(emoji){
    var div=document.createElement('div');div.className='scard';
    var pct=(counts[emoji]/max)*100;
    div.innerHTML='<span class="e">'+emoji+'</span><div class="inf"><span class="n">'+counts[emoji]+'</span><span class="l">'+emoji+'</span><div class="bar"><span style="width:'+pct+'%"></span></div></div>';
    c.appendChild(div);
  });
}

}

function showIsme(text,duration){
  var b=$('ismeBubble'),el=$('ismeText');
  el.textContent=text;b.classList.add('show');
  clearTimeout(ismeTimer);
  ismeTimer=setTimeout(function(){b.classList.remove('show');},duration||3000);
}
