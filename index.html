<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mewonen — Draw with Mei 🦫</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0a18;
            color: #fff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        #app {
            width: 100%;
            max-width: 420px;
            height: 100dvh;
            max-height: 780px;
            position: relative;
            background: radial-gradient(ellipse at 50% 30%, #141428, #06060f);
            overflow: hidden;
            border-radius: 0;
            box-shadow: 0 0 80px rgba(124, 58, 237, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* ===== CAPYBARA CONTAINER ===== */
        #capy {
            position: relative;
            width: 200px;
            height: 180px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
            z-index: 10;
        }

        #capy svg {
            width: 100%;
            height: 100%;
            display: block;
            filter: drop-shadow(0 8px 30px rgba(167, 139, 250, 0.15));
        }

        /* ===== BUBBLE ===== */
        #bubble {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(167, 139, 250, 0.10);
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.85);
            max-width: 240px;
            text-align: center;
            line-height: 1.5;
            font-weight: 300;
            letter-spacing: 0.3px;
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.3s ease;
            transform: translateX(-50%) translateY(8px);
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        #bubble.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== CANVAS ===== */
        #drawArea {
            position: relative;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(167, 139, 250, 0.08);
            box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.5);
            touch-action: none;
            margin: 6px 0 4px;
            transition: all 0.4s ease;
        }

        #drawArea:active {
            border-color: rgba(167, 139, 250, 0.25);
        }

        #drawCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: block;
            touch-action: none;
            cursor: crosshair;
        }

        /* ===== GLOW RING ===== */
        #glowRing {
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 1px solid rgba(167, 139, 250, 0.06);
            pointer-events: none;
            transition: border-color 0.6s ease, box-shadow 0.6s ease;
            z-index: 0;
        }

        #glowRing.active {
            border-color: rgba(167, 139, 250, 0.25);
            box-shadow: 0 0 40px rgba(167, 139, 250, 0.05);
        }

        /* ===== RESULT ===== */
        #result {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 6px;
            min-height: 40px;
            transition: all 0.4s ease;
        }

        #emotionEmoji {
            font-size: 2rem;
            min-height: 40px;
            animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #emotionName {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.25);
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 2px;
            min-height: 18px;
        }

        @keyframes pop {
            0% {
                opacity: 0;
                transform: scale(0.3) rotate(-8deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0);
            }
        }

        /* ===== BUTTONS ===== */
        #actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.6rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            border: none;
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            touch-action: manipulation;
            font-family: inherit;
        }

        .btn:active {
            transform: scale(0.92);
        }

        .btn-primary {
            background: linear-gradient(135deg, #7c3aed, #a78bfa);
            color: #fff;
            border: none;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.2);
        }

        .btn-primary:active {
            box-shadow: 0 2px 10px rgba(124, 58, 237, 0.15);
        }

        .btn-gold {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0a0a18;
            border: none;
            font-weight: 500;
        }

        /* ===== STREAK ===== */
        #streak {
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: 0.5rem;
            color: rgba(255, 255, 255, 0.12);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 4px;
            z-index: 20;
            background: rgba(255, 255, 255, 0.02);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        #streak span {
            color: #fbbf24;
        }

        /* ===== BADGE NOTIFICATION ===== */
        #badgeNotif {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 40, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(167, 139, 250, 0.08);
            padding: 8px 18px;
            border-radius: 16px;
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.5);
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.4s ease;
            transform: translateX(-50%) translateY(12px);
            pointer-events: none;
            z-index: 30;
            white-space: nowrap;
        }

        #badgeNotif.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        #badgeNotif .badge-icon {
            color: #fbbf24;
            margin-right: 6px;
        }

        /* ===== SHARE OVERLAY ===== */
        #shareOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        #shareOverlay.show {
            display: flex;
        }

        #shareCard {
            background: rgba(16, 16, 32, 0.98);
            border: 1px solid rgba(167, 139, 250, 0.08);
            border-radius: 24px;
            padding: 24px;
            max-width: 340px;
            width: 100%;
            text-align: center;
            animation: cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardIn {
            0% {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        #shareCard .preview {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            background: radial-gradient(circle at 30% 30%, #2a1a3a, #0a0a18);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            border: 1px solid rgba(167, 139, 250, 0.06);
            margin-bottom: 12px;
            position: relative;
            overflow: hidden;
        }

        #shareCard .preview canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #shareCard .preview-text {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 300;
            margin-bottom: 6px;
        }

        #shareCard .preview-text strong {
            color: rgba(255, 255, 255, 0.8);
        }

        #shareCard .share-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 10px;
        }

        #shareCard .share-actions .btn {
            flex: 1;
            justify-content: center;
        }

        .share-close {
            position: absolute;
            top: 8px;
            right: 12px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.15);
            font-size: 1rem;
            cursor: pointer;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 380px) {
            #capy {
                width: 150px;
                height: 135px;
            }
            #drawArea {
                width: 180px;
                height: 180px;
            }
            #bubble {
                font-size: 0.65rem;
                padding: 8px 14px;
                max-width: 180px;
            }
        }

        @media (min-width: 600px) {
            #capy {
                width: 240px;
                height: 210px;
            }
            #drawArea {
                width: 260px;
                height: 260px;
            }
            #bubble {
                font-size: 0.85rem;
                padding: 14px 24px;
                max-width: 280px;
            }
        }

        /* ===== HIDDEN ===== */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- ===== APP ===== -->
    <div id="app">

        <!-- Streak -->
        <div id="streak">🔥 <span id="streakCount">0</span> days</div>

        <!-- Capybara -->
        <div id="capy">
            <!-- SVG Capybara -->
            <svg viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
                <!-- Corps -->
                <ellipse cx="100" cy="120" rx="70" ry="50" fill="#8B6B4A" />
                <ellipse cx="100" cy="120" rx="66" ry="46" fill="#A0805A" />
                <!-- Tête -->
                <ellipse cx="100" cy="70" rx="48" ry="40" fill="#A0805A" />
                <!-- Museau -->
                <ellipse cx="100" cy="88" rx="28" ry="18" fill="#8B6B4A" />
                <ellipse cx="100" cy="86" rx="24" ry="14" fill="#C4A882" />
                <!-- Nez -->
                <ellipse cx="100" cy="80" rx="6" ry="4" fill="#4A3A2A" />
                <!-- Œil gauche -->
                <ellipse cx="80" cy="62" rx="8" ry="9" fill="#1A1A2E" id="eyeL" />
                <ellipse cx="82" cy="60" rx="3" ry="3" fill="white" id="eyeLHigh" />
                <!-- Œil droit -->
                <ellipse cx="120" cy="62" rx="8" ry="9" fill="#1A1A2E" id="eyeR" />
                <ellipse cx="122" cy="60" rx="3" ry="3" fill="white" id="eyeRHigh" />
                <!-- Oreilles -->
                <ellipse cx="60" cy="42" rx="14" ry="12" fill="#A0805A" id="earL" />
                <ellipse cx="140" cy="42" rx="14" ry="12" fill="#A0805A" id="earR" />
                <!-- Pattes -->
                <ellipse cx="60" cy="150" rx="16" ry="10" fill="#8B6B4A" />
                <ellipse cx="140" cy="150" rx="16" ry="10" fill="#8B6B4A" />
                <!-- Patte avant (pour guider) -->
                <ellipse cx="100" cy="150" rx="14" ry="10" fill="#A0805A" id="pawGuide" />
                <!-- Queue -->
                <ellipse cx="170" cy="120" rx="8" ry="6" fill="#8B6B4A" />
                <!-- Sourire -->
                <path d="M90 94 Q100 100 110 94" stroke="#4A3A2A" stroke-width="2" fill="none" id="smile" />
            </svg>

            <!-- Bulle -->
            <div id="bubble"></div>
        </div>

        <!-- Zone de dessin -->
        <div id="drawArea">
            <div id="glowRing"></div>
            <canvas id="drawCanvas" width="400" height="400"></canvas>
        </div>

        <!-- Résultat -->
        <div id="result">
            <div id="emotionEmoji"></div>
            <div id="emotionName"></div>
        </div>

        <!-- Actions -->
        <div id="actions">
            <button class="btn" id="clearBtn">Clear</button>
            <button class="btn btn-primary" id="shareBtn">📤 Share</button>
            <button class="btn btn-gold" id="statusBtn">📱 Status</button>
        </div>

        <!-- Badge notification -->
        <div id="badgeNotif"><span class="badge-icon">🎁</span> <span id="badgeText">New badge unlocked!</span></div>
    </div>

    <!-- ===== SHARE OVERLAY ===== -->
    <div id="shareOverlay">
        <div id="shareCard">
            <button class="share-close" id="shareClose">✕</button>
            <div class="preview" id="sharePreview"></div>
            <div class="preview-text" id="shareText">✨ <strong id="shareEmotion">Joy</strong> — Mewonen saw your soul</div>
            <div class="share-actions">
                <button class="btn btn-primary" id="downloadBtn">💾 Download</button>
                <button class="btn btn-gold" id="copyBtn">📋 Copy Text</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  MEWONEN X CAPYBARA — v1.0
        //  Tout en un, sans bug, prêt à l'emploi
        // ============================================================

        (function() {
            'use strict';

            // ---- DOM ----
            const canvas = document.getElementById('drawCanvas');
            const ctx = canvas.getContext('2d');
            const bubble = document.getElementById('bubble');
            const emotionEmoji = document.getElementById('emotionEmoji');
            const emotionName = document.getElementById('emotionName');
            const glowRing = document.getElementById('glowRing');
            const streakCount = document.getElementById('streakCount');
            const badgeNotif = document.getElementById('badgeNotif');
            const badgeText = document.getElementById('badgeText');
            const shareOverlay = document.getElementById('shareOverlay');
            const sharePreview = document.getElementById('sharePreview');
            const shareEmotion = document.getElementById('shareEmotion');
            const shareText = document.getElementById('shareText');
            const clearBtn = document.getElementById('clearBtn');
            const shareBtn = document.getElementById('shareBtn');
            const statusBtn = document.getElementById('statusBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const copyBtn = document.getElementById('copyBtn');
            const shareClose = document.getElementById('shareClose');

            // ---- State ----
            let isDrawing = false;
            let points = [];
            let lastEmotion = null;
            let streak = 0;
            let dayIndex = 0;
            let currentBadge = null;
            let shareImageData = null;

            // ---- Emotions ----
            const EMOTIONS = [
                { emoji: '☀️', name: 'Joy', phrase: 'You are shining today.', color: '#FBBF24' },
                { emoji: '🌧️', name: 'Sadness', phrase: 'Let it wash over you.', color: '#60A5FA' },
                { emoji: '🌪️', name: 'Anger', phrase: 'Even storms run out of rain.', color: '#EF4444' },
                { emoji: '🌈', name: 'Peace', phrase: 'You crossed the storm.', color: '#A78BFA' },
                { emoji: '🔥', name: 'Passion', phrase: 'Your fire is powerful.', color: '#F97316' },
                { emoji: '🌙', name: 'Calm', phrase: 'Rest is not weakness.', color: '#8B5CF6' },
                { emoji: '🌱', name: 'Hope', phrase: 'Something is growing.', color: '#34D399' },
                { emoji: '🕊️', name: 'Freedom', phrase: 'You are light.', color: '#F472B6' },
            ];

            // ---- Capybara moods (par jour) ----
            const CAPY_MOODS = [
                'Hey! I was waiting for you. 🦫',
                'Curious... what are you hiding today?',
                'I remember yesterday. You did great.',
                'Hehe... I have a secret for you.',
                'I\'m glad you\'re here. Really.',
                'Let\'s do something amazing today!',
                'I thought about you last night.',
                'I prepared something special!',
                'Today I\'m calm. Just vibing.',
                'You know what? I like you.',
                'I thought you wouldn\'t come back...',
                'Thank you for being here.',
                'There\'s something I haven\'t told you...',
                'TWO WEEKS together! 🎉'
            ];

            // ---- Badges ----
            const BADGES = [
                { id: 'first', name: 'First Stroke', icon: '✍️', condition: 1 },
                { id: 'week', name: 'Week Warrior', icon: '🔥', condition: 7 },
                { id: 'month', name: 'Monthly Master', icon: '👑', condition: 30 },
                { id: 'rainbow', name: 'Rainbow Soul', icon: '🌈', condition: 5 },
                { id: 'phoenix', name: 'Risen', icon: '🦋', condition: 10 },
            ];

            // ---- Streak ----
            function loadStreak() {
                try {
                    const stored = localStorage.getItem('mewonen_streak');
                    if (stored) {
                        streak = parseInt(stored, 10) || 0;
                    }
                    const lastDate = localStorage.getItem('mewonen_last_date');
                    const today = new Date().toDateString();
                    if (lastDate === today) {
                        // Already visited today
                    } else if (lastDate) {
                        const yesterday = new Date();
                        yesterday.setDate(yesterday.getDate() - 1);
                        if (lastDate === yesterday.toDateString()) {
                            streak += 1;
                        } else {
                            streak = 1;
                        }
                    } else {
                        streak = 1;
                    }
                    localStorage.setItem('mewonen_streak', String(streak));
                    localStorage.setItem('mewonen_last_date', today);
                } catch (e) {
                    streak = 1;
                }
                document.getElementById('streakCount').textContent = streak;
                // Check badges
                checkBadges();
            }

            function checkBadges() {
                const unlocked = JSON.parse(localStorage.getItem('mewonen_badges') || '[]');
                let newBadge = null;
                for (const b of BADGES) {
                    if (!unlocked.includes(b.id) && streak >= b.condition) {
                        unlocked.push(b.id);
                        newBadge = b;
                        break;
                    }
                }
                if (newBadge) {
                    localStorage.setItem('mewonen_badges', JSON.stringify(unlocked));
                    showBadgeNotif(newBadge);
                }
            }

            function showBadgeNotif(badge) {
                badgeText.textContent = `🎁 ${badge.icon} ${badge.name} unlocked!`;
                badgeNotif.classList.add('show');
                setTimeout(() => {
                    badgeNotif.classList.remove('show');
                }, 4000);
            }

            // ---- Capybara bubble ----
            function showBubble(text, duration = 3000) {
                bubble.textContent = text;
                bubble.classList.add('show');
                clearTimeout(bubble._timer);
                bubble._timer = setTimeout(() => {
                    bubble.classList.remove('show');
                }, duration);
            }

            // ---- Get capybara mood for today ----
            function getCapyMood() {
                const today = new Date();
                const start = new Date(2025, 0, 1);
                const diff = Math.floor((today - start) / (1000 * 60 * 60 * 24));
                const index = diff % CAPY_MOODS.length;
                return CAPY_MOODS[index];
            }

            // ---- Canvas drawing ----
            function setupCanvas() {
                const rect = canvas.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                ctx.scale(dpr, dpr);
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = 'rgba(200, 180, 255, 0.85)';
            }

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left),
                    y: (clientY - rect.top),
                };
            }

            function startDraw(e) {
                e.preventDefault();
                isDrawing = true;
                points = [];
                const p = getPos(e);
                points.push(p);
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                glowRing.classList.add('active');
                // Capybara guide
                showBubble('I\'m guiding you... 🦫', 2000);
            }

            function moveDraw(e) {
                e.preventDefault();
                if (!isDrawing) return;
                const p = getPos(e);
                points.push(p);
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
            }

            function endDraw() {
                if (!isDrawing) return;
                isDrawing = false;
                glowRing.classList.remove('active');
                if (points.length < 5) {
                    showBubble('Draw a little more... ✍️', 2000);
                    return;
                }
                analyzeDraw();
            }

            // ---- Analysis ----
            function analyzeDraw() {
                let totalDist = 0;
                for (let i = 1; i < points.length; i++) {
                    const dx = points[i].x - points[i - 1].x;
                    const dy = points[i].y - points[i - 1].y;
                    totalDist += Math.sqrt(dx * dx + dy * dy);
                }

                const avgDist = totalDist / points.length;
                let idx = 0;
                if (avgDist > 8) idx = 0;
                else if (avgDist > 4) idx = 3;
                else if (avgDist > 2) idx = 1;
                else if (avgDist < 1) idx = 7;
                else idx = 4;

                // Add some randomness so it's not always the same
                const rand = Math.random();
                if (rand < 0.15 && idx !== 7) idx = 2;
                else if (rand > 0.85 && idx !== 7) idx = 5;

                const emotion = EMOTIONS[idx % EMOTIONS.length];
                lastEmotion = emotion;
                displayResult(emotion);
                generateShareImage(emotion);
                showBubble(`I see... You are ${emotion.name}. ${emotion.phrase} 💜`, 4000);
            }

            function displayResult(emotion) {
                emotionEmoji.textContent = emotion.emoji;
                emotionEmoji.style.animation = 'none';
                requestAnimationFrame(() => {
                    emotionEmoji.style.animation = 'pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
                });
                emotionName.textContent = emotion.name;
                // Glow
                glowRing.style.borderColor = emotion.color + '44';
                glowRing.style.boxShadow = `0 0 60px ${emotion.color}11`;
                setTimeout(() => {
                    glowRing.style.borderColor = 'rgba(167, 139, 250, 0.06)';
                    glowRing.style.boxShadow = 'none';
                }, 3000);
            }

            // ---- Generate share image ----
            function generateShareImage(emotion) {
                const offscreen = document.createElement('canvas');
                offscreen.width = 800;
                offscreen.height = 800;
                const c = offscreen.getContext('2d');

                // Background gradient
                const grad = c.createRadialGradient(400, 400, 100, 400, 400, 500);
                grad.addColorStop(0, '#2a1a3a');
                grad.addColorStop(0.5, '#1a1030');
                grad.addColorStop(1, '#0a0a18');
                c.fillStyle = grad;
                c.fillRect(0, 0, 800, 800);

                // Glow circles
                for (let i = 0; i < 5; i++) {
                    c.beginPath();
                    c.arc(400 + (Math.random() - 0.5) * 300, 400 + (Math.random() - 0.5) * 300,
                        50 + Math.random() * 80, 0, Math.PI * 2);
                    c.fillStyle = `rgba(167, 139, 250, ${0.02 + Math.random() * 0.04})`;
                    c.fill();
                }

                // Draw the user's drawing on the share image
                const drawingData = canvas.toDataURL();
                const img = new Image();
                img.onload = function() {
                    const size = Math.min(img.width, img.height);
                    const x = (img.width - size) / 2;
                    const y = (img.height - size) / 2;
                    // Center the drawing in a circle
                    c.save();
                    c.beginPath();
                    c.arc(400, 350, 200, 0, Math.PI * 2);
                    c.clip();
                    c.drawImage(img, 400 - 200, 350 - 200, 400, 400);
                    c.restore();

                    // Border ring
                    c.beginPath();
                    c.arc(400, 350, 205, 0, Math.PI * 2);
                    c.strokeStyle = emotion.color + '44';
                    c.lineWidth = 3;
                    c.stroke();

                    // Emotion emoji
                    c.font = '80px Arial';
                    c.textAlign = 'center';
                    c.textBaseline = 'middle';
                    c.fillText(emotion.emoji, 400, 150);

                    // Emotion name
                    c.font = 'bold 48px Arial';
                    c.fillStyle = '#fff';
                    c.fillText(emotion.name, 400, 620);

                    // Phrase
                    c.font = '24px Arial';
                    c.fillStyle = 'rgba(255,255,255,0.5)';
                    c.fillText(emotion.phrase, 400, 680);

                    // Mewonen brand
                    c.font = '20px Arial';
                    c.fillStyle = '#a78bfa';
                    c.fillText('✨ @mewonen', 400, 740);

                    // Viral text
                    c.font = 'bold 28px Arial';
                    c.fillStyle = '#fff';
                    const viralText = getViralText(emotion);
                    c.fillText(viralText, 400, 570);

                    shareImageData = offscreen.toDataURL('image/png');
                };
                img.src = drawingData;
            }

            function getViralText(emotion) {
                const texts = {
                    'Joy': '✨ Mewonen saw my light.',
                    'Sadness': '💜 I drew my tears. Mewonen caught them.',
                    'Anger': '🔥 My fire. Mewonen saw it.',
                    'Peace': '🌈 I crossed the storm.',
                    'Passion': '💫 This is my power.',
                    'Calm': '🌙 This is my peace.',
                    'Hope': '🌱 Something is growing.',
                    'Freedom': '🕊️ I am light.'
                };
                return texts[emotion.name] || '💜 Mewonen saw my soul.';
            }

            // ---- Share overlay ----
            function openShare() {
                if (!shareImageData) {
                    showBubble('Draw something first! ✍️', 2000);
                    return;
                }
                const preview = document.getElementById('sharePreview');
                preview.innerHTML = '';
                const img = document.createElement('img');
                img.src = shareImageData;
                img.style.width = '100%';
                img.style.height = '100%';
                img.style.objectFit = 'contain';
                img.style.borderRadius = '16px';
                preview.appendChild(img);
                if (lastEmotion) {
                    shareEmotion.textContent = lastEmotion.name;
                    shareText.innerHTML =
                        `✨ <strong id="shareEmotion">${lastEmotion.name}</strong> — ${getViralText(lastEmotion)}`;
                }
                shareOverlay.classList.add('show');
            }

            function closeShare() {
                shareOverlay.classList.remove('show');
            }

            // ---- Download share image ----
            function downloadShare() {
                if (!shareImageData) return;
                const link = document.createElement('a');
                link.download = `mewonen-${lastEmotion ? lastEmotion.name.toLowerCase() : 'mood'}.png`;
                link.href = shareImageData;
                link.click();
            }

            // ---- Copy text ----
            function copyShareText() {
                if (!lastEmotion) return;
                const text = `${getViralText(lastEmotion)} ✨ @mewonen — Draw your mood at mewonen.com 💜`;
                navigator.clipboard.writeText(text).then(() => {
                    showBubble('📋 Text copied!', 2000);
                }).catch(() => {
                    // Fallback
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    ta.remove();
                    showBubble('📋 Text copied!', 2000);
                });
            }

            // ---- Status image ----
            function generateStatus() {
                if (!lastEmotion) {
                    showBubble('Draw something first! ✍️', 2000);
                    return;
                }
                const offscreen = document.createElement('canvas');
                offscreen.width = 800;
                offscreen.height = 800;
                const c = offscreen.getContext('2d');

                const grad = c.createRadialGradient(400, 400, 100, 400, 400, 500);
                grad.addColorStop(0, '#2a1a3a');
                grad.addColorStop(0.5, '#1a1030');
                grad.addColorStop(1, '#0a0a18');
                c.fillStyle = grad;
                c.fillRect(0, 0, 800, 800);

                c.font = '200px Arial';
                c.textAlign = 'center';
                c.textBaseline = 'middle';
                c.fillText(lastEmotion.emoji, 400, 350);

                c.font = '48px Arial';
                c.fillStyle = '#fff';
                c.fillText(lastEmotion.name, 400, 550);

                c.font = '28px Arial';
                c.fillStyle = 'rgba(255,255,255,0.4)';
                c.fillText('✨ mewonen.com', 400, 650);

                const link = document.createElement('a');
                link.download = `mewonen-status-${lastEmotion.name.toLowerCase()}.png`;
                link.href = offscreen.toDataURL('image/png');
                link.click();
                showBubble('📱 Status saved!', 2000);
            }

            // ---- Clear ----
            function clearCanvas() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                emotionEmoji.textContent = '';
                emotionName.textContent = '';
                glowRing.style.borderColor = 'rgba(167, 139, 250, 0.06)';
                glowRing.style.boxShadow = 'none';
                lastEmotion = null;
                shareImageData = null;
                showBubble('Cleared. Ready for a new drawing. ✨', 2000);
            }

            // ---- Init ----
            function init() {
                setupCanvas();
                loadStreak();

                // Show capybara greeting
                setTimeout(() => {
                    showBubble(getCapyMood(), 4000);
                }, 500);

                // After a moment, invite to draw
                setTimeout(() => {
                    showBubble('Give me your finger. Let\'s draw. 🦫', 3000);
                }, 4500);

                // Canvas events
                canvas.addEventListener('touchstart', startDraw, { passive: false });
                canvas.addEventListener('touchmove', moveDraw, { passive: false });
                canvas.addEventListener('touchend', endDraw);
                canvas.addEventListener('mousedown', startDraw);
                canvas.addEventListener('mousemove', moveDraw);
                canvas.addEventListener('mouseup', endDraw);
                canvas.addEventListener('mouseleave', endDraw);

                // Buttons
                clearBtn.addEventListener('click', clearCanvas);
                shareBtn.addEventListener('click', openShare);
                statusBtn.addEventListener('click', generateStatus);
                downloadBtn.addEventListener('click', downloadShare);
                copyBtn.addEventListener('click', copyShareText);
                shareClose.addEventListener('click', closeShare);
                shareOverlay.addEventListener('click', function(e) {
                    if (e.target === this) closeShare();
                });

                // Handle resize
                let resizeTimer;
                window.addEventListener('resize', function() {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(setupCanvas, 100);
                });

                console.log('🦫 Mewonen x Capybara — Ready');
                console.log('💜 Draw your emotion. Mei is here.');
            }

            // ---- Start ----
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
</html>
