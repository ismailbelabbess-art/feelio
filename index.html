<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mewonen — Draw with Mei 🦫</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0a18;
            color: #fff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        #app {
            width: 100%;
            max-width: 420px;
            height: 100dvh;
            max-height: 780px;
            position: relative;
            background: radial-gradient(ellipse at 50% 30%, #141428, #06060f);
            overflow: hidden;
            border-radius: 0;
            box-shadow: 0 0 80px rgba(124, 58, 237, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #capy-container {
            position: relative;
            width: 220px;
            height: 200px;
            margin-bottom: 10px;
            z-index: 10;
        }

        #capy-container svg {
            width: 100%;
            height: 100%;
            display: block;
            filter: drop-shadow(0 8px 30px rgba(167, 139, 250, 0.15));
        }

        #bubble {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(167, 139, 250, 0.10);
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.85);
            max-width: 220px;
            text-align: center;
            line-height: 1.5;
            font-weight: 300;
            letter-spacing: 0.3px;
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.3s ease;
            transform: translateX(-50%) translateY(8px);
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        #bubble.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        #drawArea {
            position: relative;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(167, 139, 250, 0.08);
            box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.5);
            touch-action: none;
            margin: 6px 0 4px;
            transition: all 0.4s ease;
        }

        #drawCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: block;
            touch-action: none;
            cursor: crosshair;
        }

        #glowRing {
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 1px solid rgba(167, 139, 250, 0.06);
            pointer-events: none;
            transition: border-color 0.6s ease, box-shadow 0.6s ease;
            z-index: 0;
        }

        #glowRing.active {
            border-color: rgba(167, 139, 250, 0.25);
            box-shadow: 0 0 40px rgba(167, 139, 250, 0.05);
        }

        #result {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 6px;
            min-height: 40px;
        }

        #emotionEmoji {
            font-size: 2rem;
            min-height: 40px;
            animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #emotionName {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.25);
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 2px;
            min-height: 18px;
        }

        @keyframes pop {
            0% {
                opacity: 0;
                transform: scale(0.3) rotate(-8deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0);
            }
        }

        #actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.6rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            border: none;
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.25s ease;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            touch-action: manipulation;
            font-family: inherit;
        }

        .btn:active {
            transform: scale(0.92);
        }

        .btn-primary {
            background: linear-gradient(135deg, #7c3aed, #a78bfa);
            color: #fff;
            border: none;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.2);
        }

        .btn-gold {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0a0a18;
            border: none;
            font-weight: 500;
        }

        #streak {
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: 0.5rem;
            color: rgba(255, 255, 255, 0.12);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 4px;
            z-index: 20;
            background: rgba(255, 255, 255, 0.02);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        #streak span {
            color: #fbbf24;
        }

        #badgeNotif {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 40, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(167, 139, 250, 0.08);
            padding: 8px 18px;
            border-radius: 16px;
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.5);
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.4s ease;
            transform: translateX(-50%) translateY(12px);
            pointer-events: none;
            z-index: 30;
            white-space: nowrap;
        }

        #badgeNotif.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        #badgeNotif .badge-icon {
            color: #fbbf24;
            margin-right: 6px;
        }

        #shareOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        #shareOverlay.show {
            display: flex;
        }

        #shareCard {
            background: rgba(16, 16, 32, 0.98);
            border: 1px solid rgba(167, 139, 250, 0.08);
            border-radius: 24px;
            padding: 24px;
            max-width: 340px;
            width: 100%;
            text-align: center;
            animation: cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardIn {
            0% {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        #shareCard .preview {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            background: radial-gradient(circle at 30% 30%, #2a1a3a, #0a0a18);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            border: 1px solid rgba(167, 139, 250, 0.06);
            margin-bottom: 12px;
            position: relative;
            overflow: hidden;
        }

        #shareCard .preview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 16px;
        }

        #shareCard .preview-text {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 300;
            margin-bottom: 6px;
        }

        #shareCard .preview-text strong {
            color: rgba(255, 255, 255, 0.8);
        }

        #shareCard .share-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 10px;
        }

        #shareCard .share-actions .btn {
            flex: 1;
            justify-content: center;
        }

        .share-close {
            position: absolute;
            top: 8px;
            right: 12px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.15);
            font-size: 1rem;
            cursor: pointer;
        }

        @media (max-width: 380px) {
            #capy-container {
                width: 170px;
                height: 155px;
            }
            #drawArea {
                width: 180px;
                height: 180px;
            }
            #bubble {
                font-size: 0.6rem;
                padding: 6px 12px;
                max-width: 160px;
            }
        }

        @media (min-width: 600px) {
            #capy-container {
                width: 260px;
                height: 230px;
            }
            #drawArea {
                width: 260px;
                height: 260px;
            }
            #bubble {
                font-size: 0.85rem;
                padding: 14px 24px;
                max-width: 280px;
            }
        }
    </style>
</head>
<body>

    <div id="app">
        <div id="streak">🔥 <span id="streakCount">0</span> days</div>

        <div id="capy-container">
            <svg viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg" id="capySvg">
                <!-- Shadow -->
                <ellipse cx="100" cy="158" rx="72" ry="8" fill="rgba(0,0,0,0.15)" />

                <!-- Body -->
                <ellipse cx="100" cy="120" rx="70" ry="50" fill="#8B6B4A" id="body" />
                <ellipse cx="100" cy="120" rx="66" ry="46" fill="#A0805A" />

                <!-- Head group -->
                <g id="head">
                    <ellipse cx="100" cy="70" rx="48" ry="40" fill="#A0805A" />
                    <!-- Snout -->
                    <ellipse cx="100" cy="88" rx="28" ry="18" fill="#8B6B4A" />
                    <ellipse cx="100" cy="86" rx="24" ry="14" fill="#C4A882" />
                    <!-- Nose -->
                    <ellipse cx="100" cy="80" rx="6" ry="4" fill="#4A3A2A" id="nose" />

                    <!-- Left eye -->
                    <g id="eyeL">
                        <ellipse cx="80" cy="62" rx="8" ry="9" fill="#1A1A2E" />
                        <ellipse cx="82" cy="59" rx="3" ry="3" fill="white" id="eyeLHigh" />
                    </g>

                    <!-- Right eye -->
                    <g id="eyeR">
                        <ellipse cx="120" cy="62" rx="8" ry="9" fill="#1A1A2E" />
                        <ellipse cx="122" cy="59" rx="3" ry="3" fill="white" id="eyeRHigh" />
                    </g>

                    <!-- Ears -->
                    <ellipse cx="60" cy="42" rx="14" ry="12" fill="#A0805A" id="earL" />
                    <ellipse cx="140" cy="42" rx="14" ry="12" fill="#A0805A" id="earR" />

                    <!-- Mouth / Smile -->
                    <path d="M90 94 Q100 100 110 94" stroke="#4A3A2A" stroke-width="2" fill="none" id="mouth" />
                </g>

                <!-- Paws -->
                <ellipse cx="60" cy="150" rx="16" ry="10" fill="#8B6B4A" />
                <ellipse cx="140" cy="150" rx="16" ry="10" fill="#8B6B4A" />

                <!-- Guide paw (front left) -->
                <g id="pawGuide">
                    <ellipse cx="100" cy="150" rx="14" ry="10" fill="#A0805A" />
                </g>

                <!-- Tail -->
                <ellipse cx="170" cy="120" rx="8" ry="6" fill="#8B6B4A" />
            </svg>

            <div id="bubble"></div>
        </div>

        <div id="drawArea">
            <div id="glowRing"></div>
            <canvas id="drawCanvas" width="400" height="400"></canvas>
        </div>

        <div id="result">
            <div id="emotionEmoji"></div>
            <div id="emotionName"></div>
        </div>

        <div id="actions">
            <button class="btn" id="clearBtn">Clear</button>
            <button class="btn btn-primary" id="shareBtn">📤 Share</button>
            <button class="btn btn-gold" id="statusBtn">📱 Status</button>
        </div>

        <div id="badgeNotif"><span class="badge-icon">🎁</span> <span id="badgeText">New badge unlocked!</span></div>
    </div>

    <div id="shareOverlay">
        <div id="shareCard">
            <button class="share-close" id="shareClose">✕</button>
            <div class="preview" id="sharePreview"></div>
            <div class="preview-text" id="shareText">✨ <strong id="shareEmotion">Joy</strong> — Mewonen saw your soul</div>
            <div class="share-actions">
                <button class="btn btn-primary" id="downloadBtn">💾 Download</button>
                <button class="btn btn-gold" id="copyBtn">📋 Copy Text</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  MEWONEN x CAPYBARA — FULLY ANIMATED
        //  ENGLISH ONLY
        // ============================================================

        (function() {
            'use strict';

            // ===== DOM REFS =====
            const canvas = document.getElementById('drawCanvas');
            const ctx = canvas.getContext('2d');
            const bubble = document.getElementById('bubble');
            const emotionEmoji = document.getElementById('emotionEmoji');
            const emotionName = document.getElementById('emotionName');
            const glowRing = document.getElementById('glowRing');
            const streakCount = document.getElementById('streakCount');
            const badgeNotif = document.getElementById('badgeNotif');
            const badgeText = document.getElementById('badgeText');
            const shareOverlay = document.getElementById('shareOverlay');
            const sharePreview = document.getElementById('sharePreview');
            const shareEmotion = document.getElementById('shareEmotion');
            const shareText = document.getElementById('shareText');
            const clearBtn = document.getElementById('clearBtn');
            const shareBtn = document.getElementById('shareBtn');
            const statusBtn = document.getElementById('statusBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const copyBtn = document.getElementById('copyBtn');
            const shareClose = document.getElementById('shareClose');

            // ===== SVG PARTS =====
            const head = document.getElementById('head');
            const eyeL = document.getElementById('eyeL');
            const eyeR = document.getElementById('eyeR');
            const eyeLHigh = document.getElementById('eyeLHigh');
            const eyeRHigh = document.getElementById('eyeRHigh');
            const mouth = document.getElementById('mouth');
            const earL = document.getElementById('earL');
            const earR = document.getElementById('earR');
            const pawGuide = document.getElementById('pawGuide');
            const nose = document.getElementById('nose');
            const body = document.getElementById('body');

            // ===== STATE =====
            let isDrawing = false;
            let points = [];
            let lastEmotion = null;
            let streak = 0;
            let shareImageData = null;
            let animFrame = null;
            let blinkTimer = null;
            let expression = 'idle';
            let isAnimating = false;

            // ===== EMOTIONS =====
            const EMOTIONS = [
                { emoji: '☀️', name: 'Joy', phrase: 'You are shining today.', color: '#FBBF24' },
                { emoji: '🌧️', name: 'Sadness', phrase: 'Let it wash over you.', color: '#60A5FA' },
                { emoji: '🌪️', name: 'Anger', phrase: 'Even storms run out of rain.', color: '#EF4444' },
                { emoji: '🌈', name: 'Peace', phrase: 'You crossed the storm.', color: '#A78BFA' },
                { emoji: '🔥', name: 'Passion', phrase: 'Your fire is powerful.', color: '#F97316' },
                { emoji: '🌙', name: 'Calm', phrase: 'Rest is not weakness.', color: '#8B5CF6' },
                { emoji: '🌱', name: 'Hope', phrase: 'Something is growing.', color: '#34D399' },
                { emoji: '🕊️', name: 'Freedom', phrase: 'You are light.', color: '#F472B6' },
            ];

            const CAPY_MOODS = [
                'Hey! I was waiting for you. 🦫',
                'Curious... what are you hiding today?',
                'I remember yesterday. You did great.',
                'Hehe... I have a secret for you.',
                'I\'m glad you\'re here. Really.',
                'Let\'s do something amazing today!',
                'I thought about you last night.',
                'I prepared something special!',
                'Today I\'m calm. Just vibing.',
                'You know what? I like you.',
                'I thought you wouldn\'t come back...',
                'Thank you for being here.',
                'There\'s something I haven\'t told you...',
                'TWO WEEKS together! 🎉'
            ];

            const BADGES = [
                { id: 'first', name: 'First Stroke', icon: '✍️', condition: 1 },
                { id: 'week', name: 'Week Warrior', icon: '🔥', condition: 7 },
                { id: 'month', name: 'Monthly Master', icon: '👑', condition: 30 },
                { id: 'rainbow', name: 'Rainbow Soul', icon: '🌈', condition: 5 },
                { id: 'phoenix', name: 'Risen', icon: '🦋', condition: 10 },
            ];

            // ===== ANIMATION ENGINE =====

            function animateCapybara(targetExpression, duration = 500) {
                if (isAnimating) return;
                isAnimating = true;
                expression = targetExpression;
                const startTime = performance.now();

                // Store original positions
                const origHeadY = 70;
                const origEarLY = 42;
                const origEarRY = 42;
                const origPawX = 100;
                const origPawY = 150;
                const origMouth = 'M90 94 Q100 100 110 94';

                let targetHeadY = origHeadY;
                let targetEarLY = origEarLY;
                let targetEarRY = origEarRY;
                let targetPawX = origPawX;
                let targetPawY = origPawY;
                let targetMouth = origMouth;
                let eyeScale = 1;
                let eyeY = 0;

                // Set targets based on expression
                switch (targetExpression) {
                    case 'happy':
                        targetHeadY = 68;
                        targetEarLY = 40;
                        targetEarRY = 40;
                        targetMouth = 'M85 92 Q100 102 115 92';
                        break;
                    case 'sad':
                        targetHeadY = 72;
                        targetEarLY = 44;
                        targetEarRY = 44;
                        targetMouth = 'M90 96 Q100 92 110 96';
                        break;
                    case 'surprised':
                        targetHeadY = 66;
                        targetEarLY = 38;
                        targetEarRY = 38;
                        targetMouth = 'M92 90 Q100 82 108 90';
                        eyeScale = 1.4;
                        break;
                    case 'proud':
                        targetHeadY = 66;
                        targetEarLY = 38;
                        targetEarRY = 38;
                        targetMouth = 'M88 92 Q100 100 112 92';
                        break;
                    case 'taunting':
                        targetHeadY = 68;
                        targetEarLY = 40;
                        targetEarRY = 40;
                        targetMouth = 'M88 90 Q100 96 112 90';
                        break;
                    case 'guiding':
                        targetPawX = 80;
                        targetPawY = 140;
                        break;
                    default:
                        break;
                }

                function animateStep(time) {
                    const progress = Math.min((time - startTime) / duration, 1);
                    const ease = 1 - Math.pow(1 - progress, 3);

                    // Interpolate head
                    const currentHeadY = origHeadY + (targetHeadY - origHeadY) * ease;
                    head.setAttribute('transform', `translate(0, ${currentHeadY - origHeadY})`);

                    // Interpolate ears
                    const currentEarLY = origEarLY + (targetEarLY - origEarLY) * ease;
                    const currentEarRY = origEarRY + (targetEarRY - origEarRY) * ease;
                    earL.setAttribute('transform', `translate(0, ${currentEarLY - origEarLY})`);
                    earR.setAttribute('transform', `translate(0, ${currentEarRY - origEarRY})`);

                    // Interpolate mouth
                    if (targetMouth !== origMouth) {
                        const currentMouth = targetMouth;
                        mouth.setAttribute('d', currentMouth);
                    }

                    // Interpolate paw
                    const currentPawX = origPawX + (targetPawX - origPawX) * ease;
                    const currentPawY = origPawY + (targetPawY - origPawY) * ease;
                    pawGuide.setAttribute('transform', `translate(${currentPawX - origPawX}, ${currentPawY - origPawY})`);

                    // Eye scaling
                    if (eyeScale !== 1) {
                        const scale = 1 + (eyeScale - 1) * ease;
                        eyeL.setAttribute('transform', `scale(${scale}, ${scale}) translate(${80 * (1 - scale) / scale}, ${62 * (1 - scale) / scale})`);
                        eyeR.setAttribute('transform', `scale(${scale}, ${scale}) translate(${120 * (1 - scale) / scale}, ${62 * (1 - scale) / scale})`);
                    }

                    if (progress < 1) {
                        requestAnimationFrame(animateStep);
                    } else {
                        isAnimating = false;
                        // Reset after a moment
                        setTimeout(() => {
                            if (expression !== 'idle') {
                                resetCapybara();
                            }
                        }, 3000);
                    }
                }

                requestAnimationFrame(animateStep);
            }

            function resetCapybara() {
                expression = 'idle';
                head.setAttribute('transform', 'translate(0, 0)');
                earL.setAttribute('transform', 'translate(0, 0)');
                earR.setAttribute('transform', 'translate(0, 0)');
                pawGuide.setAttribute('transform', 'translate(0, 0)');
                mouth.setAttribute('d', 'M90 94 Q100 100 110 94');
                eyeL.setAttribute('transform', '');
                eyeR.setAttribute('transform', '');
                isAnimating = false;
            }

            // ===== BLINK =====
            function blink() {
                eyeLHigh.style.opacity = '0';
                eyeRHigh.style.opacity = '0';
                setTimeout(() => {
                    eyeLHigh.style.opacity = '1';
                    eyeRHigh.style.opacity = '1';
                }, 150);
            }

            function startBlinkTimer() {
                clearInterval(blinkTimer);
                blinkTimer = setInterval(() => {
                    if (Math.random() > 0.3) blink();
                }, 3000 + Math.random() * 2000);
            }

            // ===== BUBBLE =====
            function showBubble(text, duration = 3000) {
                bubble.textContent = text;
                bubble.classList.add('show');
                clearTimeout(bubble._timer);
                bubble._timer = setTimeout(() => {
                    bubble.classList.remove('show');
                }, duration);
            }

            // ===== STREAK =====
            function loadStreak() {
                try {
                    const stored = localStorage.getItem('mewonen_streak');
                    streak = stored ? parseInt(stored, 10) || 0 : 0;
                    const lastDate = localStorage.getItem('mewonen_last_date');
                    const today = new Date().toDateString();
                    if (lastDate === today) {
                        // already visited
                    } else if (lastDate) {
                        const yesterday = new Date();
                        yesterday.setDate(yesterday.getDate() - 1);
                        if (lastDate === yesterday.toDateString()) {
                            streak += 1;
                        } else {
                            streak = 1;
                        }
                    } else {
                        streak = 1;
                    }
                    localStorage.setItem('mewonen_streak', String(streak));
                    localStorage.setItem('mewonen_last_date', today);
                } catch (e) {
                    streak = 1;
                }
                streakCount.textContent = streak;
                checkBadges();
            }

            function checkBadges() {
                const unlocked = JSON.parse(localStorage.getItem('mewonen_badges') || '[]');
                let newBadge = null;
                for (const b of BADGES) {
                    if (!unlocked.includes(b.id) && streak >= b.condition) {
                        unlocked.push(b.id);
                        newBadge = b;
                        break;
                    }
                }
                if (newBadge) {
                    localStorage.setItem('mewonen_badges', JSON.stringify(unlocked));
                    badgeText.textContent = `🎁 ${newBadge.icon} ${newBadge.name} unlocked!`;
                    badgeNotif.classList.add('show');
                    setTimeout(() => badgeNotif.classList.remove('show'), 4000);
                }
            }

            // ===== CAPY MOOD =====
            function getCapyMood() {
                const today = new Date();
                const start = new Date(2025, 0, 1);
                const diff = Math.floor((today - start) / (1000 * 60 * 60 * 24));
                return CAPY_MOODS[diff % CAPY_MOODS.length];
            }

            // ===== CANVAS =====
            function setupCanvas() {
                const rect = canvas.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                ctx.scale(dpr, dpr);
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = 'rgba(200, 180, 255, 0.85)';
            }

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            }

            function startDraw(e) {
                e.preventDefault();
                isDrawing = true;
                points = [];
                const p = getPos(e);
                points.push(p);
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                glowRing.classList.add('active');
                animateCapybara('guiding', 300);
                showBubble('I\'m guiding you... 🦫', 2000);
            }

            function moveDraw(e) {
                e.preventDefault();
                if (!isDrawing) return;
                const p = getPos(e);
                points.push(p);
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
            }

            function endDraw() {
                if (!isDrawing) return;
                isDrawing = false;
                glowRing.classList.remove('active');
                if (points.length < 5) {
                    showBubble('Draw a little more... ✍️', 2000);
                    resetCapybara();
                    return;
                }
                analyzeDraw();
            }

            // ===== ANALYSIS =====
            function analyzeDraw() {
                let totalDist = 0;
                for (let i = 1; i < points.length; i++) {
                    const dx = points[i].x - points[i - 1].x;
                    const dy = points[i].y - points[i - 1].y;
                    totalDist += Math.sqrt(dx * dx + dy * dy);
                }
                const avgDist = totalDist / points.length;
                let idx = 0;
                if (avgDist > 8) idx = 0;
                else if (avgDist > 4) idx = 3;
                else if (avgDist > 2) idx = 1;
                else if (avgDist < 1) idx = 7;
                else idx = 4;

                const rand = Math.random();
                if (rand < 0.15 && idx !== 7) idx = 2;
                else if (rand > 0.85 && idx !== 7) idx = 5;

                const emotion = EMOTIONS[idx % EMOTIONS.length];
                lastEmotion = emotion;
                displayResult(emotion);
                generateShareImage(emotion);

                // Capybara reacts
                let capyExpression = 'happy';
                if (emotion.name === 'Sadness') capyExpression = 'sad';
                else if (emotion.name === 'Anger') capyExpression = 'surprised';
                else if (emotion.name === 'Peace') capyExpression = 'proud';
                else if (emotion.name === 'Joy') capyExpression = 'happy';
                else capyExpression = 'happy';

                animateCapybara(capyExpression, 600);
                showBubble(`I see... You are ${emotion.name}. ${emotion.phrase} 💜`, 4000);
            }

            function displayResult(emotion) {
                emotionEmoji.textContent = emotion.emoji;
                emotionEmoji.style.animation = 'none';
                requestAnimationFrame(() => {
                    emotionEmoji.style.animation = 'pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
                });
                emotionName.textContent = emotion.name;
                glowRing.style.borderColor = emotion.color + '44';
                glowRing.style.boxShadow = `0 0 60px ${emotion.color}11`;
                setTimeout(() => {
                    glowRing.style.borderColor = 'rgba(167, 139, 250, 0.06)';
                    glowRing.style.boxShadow = 'none';
                }, 3000);
            }

            // ===== SHARE IMAGE =====
            function generateShareImage(emotion) {
                const offscreen = document.createElement('canvas');
                offscreen.width = 800;
                offscreen.height = 800;
                const c = offscreen.getContext('2d');

                const grad = c.createRadialGradient(400, 400, 100, 400, 400, 500);
                grad.addColorStop(0, '#2a1a3a');
                grad.addColorStop(0.5, '#1a1030');
                grad.addColorStop(1, '#0a0a18');
                c.fillStyle = grad;
                c.fillRect(0, 0, 800, 800);

                for (let i = 0; i < 5; i++) {
                    c.beginPath();
                    c.arc(400 + (Math.random() - 0.5) * 300, 400 + (Math.random() - 0.5) * 300,
                        50 + Math.random() * 80, 0, Math.PI * 2);
                    c.fillStyle = `rgba(167, 139, 250, ${0.02 + Math.random() * 0.04})`;
                    c.fill();
                }

                const drawingData = canvas.toDataURL();
                const img = new Image();
                img.onload = function() {
                    c.save();
                    c.beginPath();
                    c.arc(400, 350, 200, 0, Math.PI * 2);
                    c.clip();
                    c.drawImage(img, 400 - 200, 350 - 200, 400, 400);
                    c.restore();

                    c.beginPath();
                    c.arc(400, 350, 205, 0, Math.PI * 2);
                    c.strokeStyle = emotion.color + '44';
                    c.lineWidth = 3;
                    c.stroke();

                    c.font = '80px Arial';
                    c.textAlign = 'center';
                    c.textBaseline = 'middle';
                    c.fillText(emotion.emoji, 400, 150);

                    c.font = 'bold 48px Arial';
                    c.fillStyle = '#fff';
                    c.fillText(emotion.name, 400, 620);

                    c.font = '24px Arial';
                    c.fillStyle = 'rgba(255,255,255,0.5)';
                    c.fillText(emotion.phrase, 400, 680);

                    c.font = '20px Arial';
                    c.fillStyle = '#a78bfa';
                    c.fillText('✨ @mewonen', 400, 740);

                    c.font = 'bold 28px Arial';
                    c.fillStyle = '#fff';
                    const viralText = getViralText(emotion);
                    c.fillText(viralText, 400, 570);

                    shareImageData = offscreen.toDataURL('image/png');
                };
                img.src = drawingData;
            }

            function getViralText(emotion) {
                const texts = {
                    'Joy': '✨ Mewonen saw my light.',
                    'Sadness': '💜 I drew my tears. Mewonen caught them.',
                    'Anger': '🔥 My fire. Mewonen saw it.',
                    'Peace': '🌈 I crossed the storm.',
                    'Passion': '💫 This is my power.',
                    'Calm': '🌙 This is my peace.',
                    'Hope': '🌱 Something is growing.',
                    'Freedom': '🕊️ I am light.'
                };
                return texts[emotion.name] || '💜 Mewonen saw my soul.';
            }

            // ===== SHARE OVERLAY =====
            function openShare() {
                if (!shareImageData) {
                    showBubble('Draw something first! ✍️', 2000);
                    return;
                }
                sharePreview.innerHTML = '';
                const img = document.createElement('img');
                img.src = shareImageData;
                sharePreview.appendChild(img);
                if (lastEmotion) {
                    shareEmotion.textContent = lastEmotion.name;
                    shareText.innerHTML =
                        `✨ <strong id="shareEmotion">${lastEmotion.name}</strong> — ${getViralText(lastEmotion)}`;
                }
                shareOverlay.classList.add('show');
            }

            function closeShare() {
                shareOverlay.classList.remove('show');
            }

            function downloadShare() {
                if (!shareImageData) return;
                const link = document.createElement('a');
                link.download = `mewonen-${lastEmotion ? lastEmotion.name.toLowerCase() : 'mood'}.png`;
                link.href = shareImageData;
                link.click();
            }

            function copyShareText() {
                if (!lastEmotion) return;
                const text =
                    `${getViralText(lastEmotion)} ✨ @mewonen — Draw your mood at mewonen.com 💜`;
                navigator.clipboard.writeText(text).then(() => {
                    showBubble('📋 Text copied!', 2000);
                }).catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    ta.remove();
                    showBubble('📋 Text copied!', 2000);
                });
            }

            function generateStatus() {
                if (!lastEmotion) {
                    showBubble('Draw something first! ✍️', 2000);
                    return;
                }
                const offscreen = document.createElement('canvas');
                offscreen.width = 800;
                offscreen.height = 800;
                const c = offscreen.getContext('2d');

                const grad = c.createRadialGradient(400, 400, 100, 400, 400, 500);
                grad.addColorStop(0, '#2a1a3a');
                grad.addColorStop(0.5, '#1a1030');
                grad.addColorStop(1, '#0a0a18');
                c.fillStyle = grad;
                c.fillRect(0, 0, 800, 800);

                c.font = '200px Arial';
                c.textAlign = 'center';
                c.textBaseline = 'middle';
                c.fillText(lastEmotion.emoji, 400, 350);

                c.font = '48px Arial';
                c.fillStyle = '#fff';
                c.fillText(lastEmotion.name, 400, 550);

                c.font = '28px Arial';
                c.fillStyle = 'rgba(255,255,255,0.4)';
                c.fillText('✨ mewonen.com', 400, 650);

                const link = document.createElement('a');
                link.download = `mewonen-status-${lastEmotion.name.toLowerCase()}.png`;
                link.href = offscreen.toDataURL('image/png');
                link.click();
                showBubble('📱 Status saved!', 2000);
            }

            function clearCanvas() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                emotionEmoji.textContent = '';
                emotionName.textContent = '';
                glowRing.style.borderColor = 'rgba(167, 139, 250, 0.06)';
                glowRing.style.boxShadow = 'none';
                lastEmotion = null;
                shareImageData = null;
                resetCapybara();
                showBubble('Cleared. Ready for a new drawing. ✨', 2000);
            }

            // ===== INIT =====
            function init() {
                setupCanvas();
                loadStreak();
                startBlinkTimer();

                setTimeout(() => {
                    showBubble(getCapyMood(), 4000);
                }, 500);

                setTimeout(() => {
                    showBubble('Give me your finger. Let\'s draw together. 🦫', 3000);
                }, 4500);

                canvas.addEventListener('touchstart', startDraw, { passive: false });
                canvas.addEventListener('touchmove', moveDraw, { passive: false });
                canvas.addEventListener('touchend', endDraw);
                canvas.addEventListener('mousedown', startDraw);
                canvas.addEventListener('mousemove', moveDraw);
                canvas.addEventListener('mouseup', endDraw);
                canvas.addEventListener('mouseleave', endDraw);

                clearBtn.addEventListener('click', clearCanvas);
                shareBtn.addEventListener('click', openShare);
                statusBtn.addEventListener('click', generateStatus);
                downloadBtn.addEventListener('click', downloadShare);
                copyBtn.addEventListener('click', copyShareText);
                shareClose.addEventListener('click', closeShare);
                shareOverlay.addEventListener('click', function(e) {
                    if (e.target === this) closeShare();
                });

                let resizeTimer;
                window.addEventListener('resize', function() {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(setupCanvas, 100);
                });

                console.log('🦫 Mewonen x Capybara — Fully Animated');
                console.log('💜 English Only — Ready');
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
