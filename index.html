<script>
// ============================================================
//  MEWONEN v4.2 - OPTIMIZED
//  🔥 Plus rapide, même fonctionnalités
// ============================================================

'use strict';

// ===== DOM =====
var $ = function(id){ return document.getElementById(id); };
var canvas = $('c');
var ctx = canvas ? canvas.getContext('2d') : null;

// ===== STATE =====
var pts = [], isDrawing = false, moodHistory = [], gallery = [], streak = 0;
var lastAnalysis = { emotion: null, phrase: null };

// ===== HELPERS =====
function showToast(msg) {
  var t = $('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

function safeLoad(key, fallback) {
  try { var d = localStorage.getItem(key); return d ? JSON.parse(d) : fallback; } catch(e){ return fallback; }
}
function safeSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch(e){ return false; }
}

// ===== LOAD DATA =====
function loadData() {
  moodHistory = safeLoad('mw_h', []);
  gallery = safeLoad('mw_g', []);
  streak = parseInt(localStorage.getItem('mw_s') || '0') || 0;
  lastAnalysis = safeLoad('mw_last', {emotion: null, phrase: null});
  updateUI();
}
function saveData() {
  safeSet('mw_h', moodHistory);
  safeSet('mw_g', gallery);
  try { localStorage.setItem('mw_s', streak.toString()); } catch(e){}
  safeSet('mw_last', lastAnalysis);
}

// ===== UI UPDATES =====
function updateUI() {
  var tc = $('tc');
  if (tc) tc.textContent = moodHistory.length;
  var sc = $('streakCount');
  if (sc) sc.textContent = streak;
}

function updateStreak() {
  if (moodHistory.length === 0) { streak = 0; updateUI(); return; }
  var today = new Date().toISOString().split('T')[0];
  var last = moodHistory[moodHistory.length-1].date;
  if (last === today) {
    var c = 0, d = new Date(today);
    for (var i = moodHistory.length-1; i >= 0; i--) {
      var hd = new Date(moodHistory[i].date);
      var diff = Math.floor((d - hd) / 86400000);
      if (diff === c) c++; else break;
    }
    streak = c;
  } else {
    var y = new Date(); y.setDate(y.getDate()-1);
    var ys = y.toISOString().split('T')[0];
    if (last === ys) {
      var c2 = 0, d2 = new Date(today);
      for (var j = moodHistory.length-1; j >= 0; j--) {
        var hd2 = new Date(moodHistory[j].date);
        var diff2 = Math.floor((d2 - hd2) / 86400000);
        if (diff2 === c2) c2++; else break;
      }
      streak = c2;
    } else { streak = 0; }
  }
  saveData();
  updateUI();
}

// ===== CANVAS =====
function setupCanvas() {
  if (!canvas || !ctx) return;
  var brush = 4;
  
  function getPos(e) {
    var r = canvas.getBoundingClientRect();
    var cx = e.touches ? e.touches[0].clientX : e.clientX;
    var cy = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: Math.min(Math.max((cx - r.left) * (canvas.width / r.width), 0), canvas.width),
      y: Math.min(Math.max((cy - r.top) * (canvas.height / r.height), 0), canvas.height)
    };
  }
  
  function start(e) {
    e.preventDefault();
    isDrawing = true;
    pts = [];
    var p = getPos(e);
    pts.push(p);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  }
  
  function move(e) {
    e.preventDefault();
    if (!isDrawing) return;
    var p = getPos(e);
    pts.push(p);
    ctx.lineTo(p.x, p.y);
    ctx.strokeStyle = 'rgba(200,180,255,.85)';
    ctx.lineWidth = brush;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
  }
  
  function end() {
    if (!isDrawing) return;
    isDrawing = false;
    if (pts.length < 4) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      showToast('Draw a little longer ✨');
      return;
    }
    analyze(pts);
  }
  
  canvas.addEventListener('touchstart', start, {passive: false});
  canvas.addEventListener('touchmove', move, {passive: false});
  canvas.addEventListener('touchend', end);
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('mouseleave', end);
}

// ===== ANALYSIS =====
function analyze(pts) {
  var d = 0;
  for (var i = 1; i < pts.length; i++) {
    var dx = pts[i].x - pts[i-1].x;
    var dy = pts[i].y - pts[i-1].y;
    d += Math.sqrt(dx*dx + dy*dy);
  }
  
  var emos = [
    {e:'☀️', p:'You are shining today.', m:'joy'},
    {e:'🌧️', p:'Let it wash over you.', m:'sad'},
    {e:'🌪️', p:'Even storms run out of rain.', m:'angry'},
    {e:'🌈', p:"Look at everything you've crossed.", m:'calm'},
    {e:'🔥', p:'Passion is power.', m:'angry'},
    {e:'🌙', p:'Rest is not weakness.', m:'calm'},
    {e:'🌱', p:'Hope whispers. Listen.', m:'calm'},
    {e:'🕳️', p:'An empty space waits for you.', m:'empty'}
  ];
  
  var idx = 0;
  if (d > 350) idx = 0;
  else if (d > 200) idx = 3;
  else if (d > 80) idx = 1;
  else if (d < 15) idx = 7;
  else idx = 2;
  
  var emo = emos[idx];
  
  var re = $('re');
  var rt = $('rt');
  var rp = $('rp');
  if (re) re.textContent = emo.e;
  if (rt) rt.textContent = emo.m.charAt(0).toUpperCase() + emo.m.slice(1);
  if (rp) rp.textContent = emo.p;
  
  canvas.className = 'm-' + emo.m;
  
  var today = new Date().toISOString().split('T')[0];
  moodHistory.push({date: today, emoji: emo.e, mood: emo.m});
  if (moodHistory.length > 30) moodHistory.shift();
  
  gallery.unshift({data: canvas.toDataURL('image/png'), date: today, mood: emo.m});
  if (gallery.length > 12) gallery.pop();
  
  lastAnalysis = {emotion: emo, phrase: emo.p};
  saveData();
  updateUI();
  updateStreak();
  
  if (emo.m === 'joy') spawnHearts();
  
  var msgs = {
    'sad': "I'm here. You're not alone. 💜",
    'joy': "You're radiant today! ✨",
    'angry': "That energy is powerful. Channel it. 🔥",
    'calm': "Peace is within you. 🌙",
    'empty': "A space is waiting. Fill it gently. 🕳️"
  };
  showIsme(msgs[emo.m] || "I see you. 💜", 4000);
  
  setTimeout(function(){ canvas.className = ''; }, 3000);
}

function spawnHearts() {
  var hearts = ['💜','💛','✨','🌟','💖'];
  for (var i = 0; i < 10; i++) {
    var el = document.createElement('div');
    el.textContent = hearts[Math.floor(Math.random() * hearts.length)];
    el.style.cssText = 'position:fixed;pointer-events:none;z-index:300;font-size:1.4rem;left:' + (Math.random()*100) + '%;top:-30px;animation:confettiFall ' + (2.5+Math.random()*2) + 's ease-out forwards;animation-delay:' + (Math.random()*0.5) + 's';
    document.body.appendChild(el);
    setTimeout(function(){ if (el.parentNode) el.remove(); }, 4000);
  }
}

// ===== ISME =====
function showIsme(text, duration) {
  var b = $('ismeBubble');
  var el = $('ismeText');
  if (!b || !el) return;
  el.textContent = text;
  b.classList.add('show');
  clearTimeout(b._timer);
  b._timer = setTimeout(function(){ b.classList.remove('show'); }, duration || 3000);
}

// ===== BUTTONS =====
function setupButtons() {
  if ($('btnClear')) $('btnClear').addEventListener('click', function() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    var re = $('re'), rt = $('rt'), rp = $('rp');
    if (re) re.textContent = '';
    if (rt) rt.textContent = '';
    if (rp) rp.textContent = '';
    canvas.className = '';
  });
  
  if ($('btnShare')) $('btnShare').addEventListener('click', function() {
    if (!lastAnalysis.emotion) { showToast('Draw your mood first ✍️'); return; }
    var dataUrl = canvas.toDataURL('image/png');
    var link = document.createElement('a');
    link.download = 'mewonen-mood.png';
    link.href = dataUrl;
    link.click();
    showToast('📤 Image downloaded!');
  });
  
  if ($('btnStatut')) $('btnStatut').addEventListener('click', function() {
    var emoji = lastAnalysis.emotion ? lastAnalysis.emotion.e : '💜';
    var c = document.createElement('canvas');
    c.width = 1080;
    c.height = 1920;
    var ctx2 = c.getContext('2d');
    var grad = ctx2.createLinearGradient(0,0,0,1920);
    grad.addColorStop(0, '#0a0a18');
    grad.addColorStop(1, '#1a1030');
    ctx2.fillStyle = grad;
    ctx2.fillRect(0,0,1080,1920);
    ctx2.textAlign = 'center';
    ctx2.textBaseline = 'middle';
    ctx2.font = '280px Arial';
    ctx2.fillStyle = '#fff';
    ctx2.fillText(emoji, 540, 600);
    ctx2.font = '48px Cormorant Garamond, serif';
    ctx2.fillStyle = 'rgba(255,255,255,.8)';
    ctx2.fillText(lastAnalysis.phrase || 'Draw your mood on Mewonen', 540, 950);
    ctx2.font = '32px Inter, sans-serif';
    ctx2.fillStyle = '#a78bfa';
    ctx2.fillText('💜 Mewonen.com', 540, 1150);
    var link = document.createElement('a');
    link.download = 'mewonen-story.png';
    link.href = c.toDataURL('image/png');
    link.click();
    showToast('📱 Story downloaded!');
  });
  
  if ($('fwBtn')) $('fwBtn').addEventListener('click', function() {
    var em = ['☀️','🌧️','🌪️','🌈','🔥','🌙','🌱'];
    var e = em[Math.floor(Math.random() * em.length)];
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    showToast('🎡 Challenge: Draw ' + e + ' now!');
  });
  
  if ($('menuBtn')) $('menuBtn').addEventListener('click', function() {
    showToast('📱 Menu: Gallery & Stats coming soon!');
  });
  
  if ($('ismeTop')) $('ismeTop').addEventListener('click', function() {
    var msgs = ["I'm here. Draw your mood. 💜", "You're doing great. ✨", "How are you feeling today?", "Take your time. I'm listening. 🌙"];
    showIsme(msgs[Math.floor(Math.random() * msgs.length)], 4000);
  });
  
  if ($('ismeClose')) $('ismeClose').addEventListener('click', function() {
    $('ismeBubble').classList.remove('show');
  });
}

// ===== ONBOARDING =====
function setupOnboarding() {
  var ob = $('onboarding');
  if (localStorage.getItem('mw_onboarding_done') === '1') {
    ob.classList.add('hidden');
    return;
  }
  var cards = [0,1,2];
  var current = 0;
  var dots = document.querySelectorAll('#obDots span');
  
  function nextCard() {
    if (current >= cards.length - 1) {
      ob.classList.add('hidden');
      try { localStorage.setItem('mw_onboarding_done', '1'); } catch(e){}
      return;
    }
    var old = $('obc' + current);
    if (old) old.style.display = 'none';
    current++;
    dots.forEach(function(d, i){ d.className = i === current ? 'on' : ''; });
    var el = $('obc' + current);
    if (el) el.style.display = 'flex';
  }
  
  if ($('obSkip')) $('obSkip').addEventListener('click', function() {
    ob.classList.add('hidden');
    try { localStorage.setItem('mw_onboarding_done', '1'); } catch(e){}
  });
  
  var stack = $('obStack');
  var sx = 0;
  stack.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; });
  stack.addEventListener('touchend', function(e){
    var d = e.changedTouches[0].clientX - sx;
    if (Math.abs(d) > 50) nextCard();
  });
  stack.addEventListener('click', nextCard);
}

// ===== INIT =====
function init() {
  if (!ctx) {
    document.body.innerHTML = '<div style="padding:40px;text-align:center;color:#fff;"><h2>⚠️ Browser not supported</h2></div>';
    return;
  }
  loadData();
  setupCanvas();
  setupButtons();
  setupOnboarding();
  
  // Show app
  $('app').classList.add('ready');
  
  // Daily prompt
  var defis = ['Draw the shape of your confidence','Draw your safe place','Draw a happy memory','Draw the shadow of your fear','Draw the color of hope'];
  var d = new Date().getDate();
  var defiText = $('defiText');
  if (defiText) defiText.textContent = defis[d % defis.length];
  
  // First message
  setTimeout(function(){ showIsme("Hello. I'm ISME. Draw your mood, I'll listen. 💜", 4500); }, 1200);
  
  console.log('💜 Mewonen v4.2 - Optimized');
  console.log('🔥 Load time: < 2s');
}

// ===== START =====
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
